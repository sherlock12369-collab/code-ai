name: Code AI 2.0 빌드 (Tauri)

# v2.0.0 같은 태그를 올리면 Code AI(app/)의 Windows/macOS 설치 파일을 만들어 릴리스에 올린다.
# (SEUL Chat은 따로 버전을 매긴다: release-seul-chat.yml, seul-chat-v* 태그)
# (1.x Electron 앱은 release.yml이 v1.* 태그로 만든다)
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v2.0.0-alpha.1)'
        required: true

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: app, os: windows-latest, args: --bundles nsis, out: release/bundle/nsis/*.exe }
          # Intel + Apple Silicon 둘 다 되는 universal 빌드, ad-hoc 서명(tauri.conf.json의 signingIdentity "-")
          - { dir: app, os: macos-latest, args: --target universal-apple-darwin --bundles dmg, out: universal-apple-darwin/release/bundle/dmg/*.dmg }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}/src-tauri
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      - run: npx tauri build ${{ matrix.args }}
        working-directory: ${{ matrix.dir }}
      - name: 릴리스에 업로드
        shell: bash
        run: |
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SEUL AI ${TAG#v}" --notes "Code AI · SEUL Chat ${TAG#v}" $pre
          shopt -s nullglob
          files=(${{ matrix.dir }}/src-tauri/target/${{ matrix.out }})
          echo "업로드: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber
